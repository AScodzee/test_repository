name: tests
on:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: mkdir -p coverage
      - run: node --test --experimental-test-coverage --test-reporter=lcov --test-reporter-destination=coverage/lcov.info --test-reporter=spec --test-reporter-destination=stdout
      # Codzee finds a coverage report among the run's artifacts.
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
