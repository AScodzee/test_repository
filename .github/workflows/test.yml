name: tests
on:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: mkdir -p coverage
      - run: node --test --experimental-test-coverage --test-reporter=lcov --test-reporter-destination=coverage/lcov.info --test-reporter=spec --test-reporter-destination=stdout
      # Sent to Codzee instead of left as an artifact.
      - name: Send coverage to Codzee
        if: always()
        env:
          CODZEE_CI_TOKEN: ${{ secrets.CODZEE_CI_TOKEN }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          curl -fsS -X POST "https://codzeeweb-production.up.railway.app/api/coverage/upload?repo=${{ github.repository }}&commit=$COMMIT" -H "Authorization: Bearer $CODZEE_CI_TOKEN" --data-binary @coverage/lcov.info
